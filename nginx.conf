server {
    listen 80;
    
    # Set the root directory where the built files are located
    root /usr/share/nginx/html;

    # ─── Security Response Headers ─────────────────────────────────────────────
    
    # HSTS: prevent protocol downgrade attacks (HTTPS only, 1-year, all subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Referrer-Policy: only send origin on same-site, omit cross-origin path/query
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP: strictly enforces allowed sources for resources to mitigate XSS attacks.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://ekvzvjxwvjlgquvxfkqy.supabase.co; connect-src 'self' https://ekvzvjxwvjlgquvxfkqy.supabase.co wss://ekvzvjxwvjlgquvxfkqy.supabase.co https://p9888.api.infobip.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Retain existing headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # NOTE: X-XSS-Protection is intentionally removed — it is deprecated and
    # ignored by all modern browsers. Removal was mandated by the security audit.

    # ─── SPA Routing ───────────────────────────────────────────────────────────
    # If a file isn't found, fallback to index.html so React Router can handle it
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional: Basic error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
